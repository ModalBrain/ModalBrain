name: Audio Bug or Host Crash Report
description: Report an audio glitch, buffer underrun (XRUN), CPU spike, or DAW crash.
title: "[Bug]: "
labels: ["bug", "audio-engine"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with ModalBrain! Please detail your audio host, hardware interface, and reproduction steps.
  - type: dropdown
    id: issue_category
    attributes:
      label: Bug Category
      options:
        - "Audio Dropouts / XRUNs"
        - "Host / DAW Crash"
        - "Audio Thread Memory Allocation / CPU Spike"
        - "Parameter Desynchronization / Automation Glitch"
        - "UI / Canvas Rendering Issue"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: host_daw
    attributes:
      label: Audio Host / DAW
      options:
        - "Bitwig Studio"
        - "Ableton Live"
        - "Reaper"
        - "Cardinal / VCV Rack"
        - "Pure Data / Max MSP"
        - "Bespoke Synth"
        - "Standalone Application"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: plugin_format
    attributes:
      label: Plugin Format
      options:
        - "CLAP"
        - "VST3"
        - "LV2"
        - "Standalone / CLI"
    validations:
      required: true
  - type: input
    id: audio_environment
    attributes:
      label: Audio Setup (OS, Driver, Sample Rate, Buffer Size)
      description: "Example: Linux (PipeWire / JACK), 48kHz, 128 frames"
      placeholder: "e.g., Linux 6.11, PipeWire-JACK, 48000 Hz, 128 samples"
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Insert plugin on an audio track
        2. Set filter cutoff modulation to LFO 1
        3. Sweep buffer size or automate cutoff rapidly
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs Actual Behavior
      placeholder: Expected smooth interpolation without clipping; heard loud clicks and saw buffer underrun.
    validations:
      required: true
  - type: textarea
    id: logs_or_traces
    attributes:
      label: Crash Logs or Stack Trace (if applicable)
      render: shell
